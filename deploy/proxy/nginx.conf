# Edge-Proxy vor den App-Replicas (ein Container pro Compose-Stack).
#
#   Port 80  ->  Frontend-Replicas (http://frontend:80). Das Frontend-nginx macht
#                selbst SPA-Fallback + /api-Proxy, /api-Requests über Port 80
#                funktionieren also unverändert weiter.
#   Port 81  ->  Backend-Replicas direkt (http://backend:3000). Direkter API-Zugang
#                für Healthchecks (deploy.sh curl) und den Grafana-Live-Poll.
#
# Warum ein Edge-Proxy? Mit deploy.replicas > 1 kann kein Service mehr selbst einen
# Host-Port publizieren (Port-Kollision). Der Proxy veröffentlicht die Host-Ports
# und verteilt auf alle Replicas.
#
# Load-Balancing ohne upstream{}-Block: Docker-DNS (127.0.0.11) liefert unter dem
# Service-Namen ALLE Replica-IPs; nginx verteilt round-robin. proxy_pass über eine
# Variable erzwingt Re-Resolution pro Request statt Startup-Caching — so werden beim
# Rolling neu gestartete Replicas ohne nginx-Reload erkannt und weggefallene gemieden
# (exakt das erprobte Muster aus apps/frontend/nginx.conf).

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $upstream http://frontend:80;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Schnelles Failover während eines Rolling-Deployments: läuft eine gerade
        # ersetzte Replica nicht mehr, wird zügig die nächste probiert.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}

server {
    listen 81;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $upstream http://backend:3000;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
