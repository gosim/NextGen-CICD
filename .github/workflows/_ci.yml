# Reusable CI: Qualitätsprüfung + Image-Builds (build once, deploy many).
# Läuft IMMER auf GitHub-hosted Runnern — nie auf dem self-hosted Deploy-Runner (Sicherheit).
# Tests und Image-Builds laufen PARALLEL (Wanduhrzeit ≈ max statt Summe); deployt wird
# trotzdem nur, wenn der gesamte CI-Workflow grün ist (needs in pipeline.yml).
name: CI (reusable)

on:
  workflow_call:
    inputs:
      push_images:
        description: 'Images nach GHCR pushen (nur main-Pipeline, nicht PRs)'
        type: boolean
        default: false
    outputs:
      image_tag:
        description: 'Unveränderlicher Image-Tag (sha-<shortsha>) für alle Umgebungen'
        value: ${{ jobs.quality.outputs.image_tag }}

jobs:
  quality:
    name: 🧪 Lint & Tests
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Versions-Metadaten berechnen
        id: vars
        run: echo "image_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencies installieren
        run: pnpm install --frozen-lockfile
      - name: Shared-Package bauen
        run: pnpm --filter @nextgen/shared build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit- & API-Tests
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/app
        run: pnpm test

  build-images:
    name: '📦 Image: ${{ matrix.image }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: apps/backend/Dockerfile
          - image: frontend
            dockerfile: apps/frontend/Dockerfile
          - image: e2e
            dockerfile: e2e/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Versions-Metadaten berechnen
        id: vars
        run: |
          echo "image_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Deploy-Ziel ist ein Apple-Silicon-Mac: Images werden als linux/arm64
      # gebaut (QEMU-Emulation auf den amd64-GitHub-Runnern).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: GHCR-Login
        if: inputs.push_images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ inputs.push_images }}
          tags: ${{ steps.vars.outputs.registry }}/${{ matrix.image }}:${{ steps.vars.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            GIT_SHA=${{ steps.vars.outputs.image_tag }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
