server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker-interner DNS: Backend-IP darf nicht dauerhaft gecacht werden, sonst
    # zeigt nginx nach einem Backend-Recreate (Deploy/Rollback bei unverändertem
    # Frontend-Image) auf die alte IP und liefert nur noch 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API same-origin an das Backend im selben Compose-Netz weiterreichen.
    # proxy_pass über Variable erzwingt Re-Resolution statt Startup-Caching.
    location /api {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html nie cachen: nach Deploy/Rollback muss sofort das zum Image
    # passende Bundle geladen werden (sonst weißer Screen durch fehlende Assets).
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite-Assets sind content-gehasht und damit unbegrenzt cachebar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA-Fallback: unbekannte Pfade liefern die index.html.
    location / {
        try_files $uri /index.html;
    }
}
