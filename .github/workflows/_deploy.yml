# Reusable Deploy: Backup → Deploy → Quality Gate → Promote | automatischer Rollback.
# Kernprinzip: Eine Version, die das Gate nicht besteht, bleibt NIE auf der Umgebung stehen —
# der Workflow-Run wird rot (Signal), die Umgebung bleibt grün (letzte gute Version + DB-Restore).
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      env_key:
        description: 'Umgebungs-Kürzel: int | abnahme | prod'
        type: string
        required: true
      gh_environment:
        description: 'GitHub-Environment-Name (Protection Rules!)'
        type: string
        required: true
      image_tag:
        description: 'Zu deployender Image-Tag (sha-…)'
        type: string
        required: true
      gate_project:
        description: 'Playwright-Project des Quality Gates: int-regression | abnahme | smoke'
        type: string
        required: true
      frontend_port:
        description: 'Host-Port des Frontends dieser Umgebung'
        type: string
        required: true
      demo_flaky:
        description: 'Demo: absichtlich flaky Test aktivieren'
        type: boolean
        default: false
      demo_bug:
        description: 'Demo: Laufzeit-Bug (none | broken-create)'
        type: string
        default: 'none'

# Ein laufendes Deploy/Rollback pro Umgebung darf NIE abgebrochen werden (halb restaurierte DB!)
concurrency:
  group: deploy-${{ inputs.env_key }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 'Backup & State (${{ inputs.env_key }})'
    runs-on: [self-hosted, macOS, deploy]
    outputs:
      last_green: ${{ steps.state.outputs.last_green }}
      backup_file: ${{ steps.backup.outputs.backup_file }}
    steps:
      - uses: actions/checkout@v4
      - name: Letzte grüne Version lesen
        id: state
        run: |
          LAST_GREEN="$(deploy/scripts/state.sh get ${{ inputs.env_key }} last_green)"
          echo "last_green=${LAST_GREEN}" >> "$GITHUB_OUTPUT"
          echo "Letzte grüne Version: ${LAST_GREEN:-<keine — Bootstrap>}"
      - name: Datenbank-Backup (pg_dump) vor dem Deployment
        id: backup
        run: |
          BACKUP_FILE="$(IMAGE_TAG='${{ inputs.image_tag }}' deploy/scripts/backup.sh ${{ inputs.env_key }})"
          echo "backup_file=${BACKUP_FILE}" >> "$GITHUB_OUTPUT"
          if [ -n "$BACKUP_FILE" ]; then
            deploy/scripts/state.sh set ${{ inputs.env_key }} last_backup="$BACKUP_FILE"
          fi

  deploy:
    name: 'Deploy ${{ inputs.image_tag }} → ${{ inputs.env_key }}'
    runs-on: [self-hosted, macOS, deploy]
    needs: prepare
    environment:
      name: ${{ inputs.gh_environment }}
      url: http://localhost:${{ inputs.frontend_port }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # Eigene Docker-Config ohne Keychain-Credential-Helper: im LaunchAgent-Kontext
      # des Runners ist Keychain-Zugriff verboten ("User interaction is not allowed").
      # Export über GITHUB_ENV, damit alle Folge-Steps dieselbe Config nutzen
      # (der runner-Kontext ist in job-level env nicht verfügbar).
      - name: GHCR-Login (Keychain-frei)
        run: |
          DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          export DOCKER_CONFIG
          mkdir -p "$DOCKER_CONFIG"
          printf '{"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}' > "$DOCKER_CONFIG/config.json"
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Stack deployen (compose up --wait, inkl. Migrations-One-Shot)
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEMO_BUG: ${{ inputs.demo_bug }}
        run: deploy/scripts/deploy.sh ${{ inputs.env_key }}
      - name: State & Ops-Event aktualisieren
        run: |
          deploy/scripts/state.sh set ${{ inputs.env_key }} current='${{ inputs.image_tag }}'
          deploy/scripts/ops-event.sh deployment '${{ inputs.env_key }}' '${{ inputs.image_tag }}' \
            '${{ github.sha }}' '${{ github.actor }}' deployed '' \
            '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  gate:
    name: 'Quality Gate: ${{ inputs.gate_project }}'
    runs-on: [self-hosted, macOS, deploy]
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: E2E-Tests gegen die deployte Umgebung (im Playwright-Container)
        id: run
        run: |
          REGISTRY="$(grep '^REGISTRY=' deploy/env/${{ inputs.env_key }}.env | cut -d= -f2)"
          OUT="$RUNNER_TEMP/e2e-out"
          rm -rf "$OUT" && mkdir -p "$OUT/test-results" "$OUT/playwright-report"
          GATE_START=$(date +%s)
          echo "gate_start=$GATE_START" >> "$GITHUB_OUTPUT"
          docker run --rm \
            -e BASE_URL='http://host.docker.internal:${{ inputs.frontend_port }}' \
            -e RUN_ID='${{ github.run_id }}' \
            -e DEMO_FLAKY='${{ inputs.demo_flaky }}' \
            -e CI=true \
            -v "$OUT/test-results:/repo/e2e/test-results" \
            -v "$OUT/playwright-report:/repo/e2e/playwright-report" \
            "$REGISTRY/e2e:${{ inputs.image_tag }}" \
            --project='${{ inputs.gate_project }}'
      - name: Testreport-Zusammenfassung (inkl. Flaky-Warnung)
        id: summary
        if: always()
        run: |
          REGISTRY="$(grep '^REGISTRY=' deploy/env/${{ inputs.env_key }}.env | cut -d= -f2)"
          OUT="$RUNNER_TEMP/e2e-out"
          if [ ! -f "$OUT/test-results/results.json" ]; then
            echo "Kein results.json vorhanden — Zusammenfassung übersprungen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker run --rm --entrypoint node \
            -e GITHUB_STEP_SUMMARY=/ghs -e GITHUB_OUTPUT=/gho \
            -v "$GITHUB_STEP_SUMMARY:/ghs" -v "$GITHUB_OUTPUT:/gho" \
            -v "$OUT/test-results:/repo/e2e/test-results" \
            "$REGISTRY/e2e:${{ inputs.image_tag }}" \
            scripts/report-summary.mjs
      - name: Report & Traces als Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ inputs.env_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e-out/playwright-report
            ${{ runner.temp }}/e2e-out/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Ops-Event Testlauf
        if: always()
        run: |
          GATE_END=$(date +%s)
          DURATION=$((GATE_END - ${{ steps.run.outputs.gate_start || 0 }}))
          [ "${{ steps.run.outputs.gate_start || 0 }}" = "0" ] && DURATION=''
          deploy/scripts/ops-event.sh test_run '${{ inputs.env_key }}' '${{ inputs.gate_project }}' \
            "${{ steps.summary.outputs.total || 0 }}" "${{ steps.summary.outputs.passed || 0 }}" \
            "${{ steps.summary.outputs.failed || 0 }}" "${{ steps.summary.outputs.flaky || 0 }}" \
            "${{ steps.summary.outputs.skipped || 0 }}" \
            '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  promote:
    name: 'Promote: ${{ inputs.env_key }} ist grün'
    runs-on: [self-hosted, macOS, deploy]
    needs: [prepare, deploy, gate]
    steps:
      - uses: actions/checkout@v4
      - name: last_green fortschreiben & Images gegen Prune pinnen
        run: |
          deploy/scripts/state.sh set ${{ inputs.env_key }} last_green='${{ inputs.image_tag }}'
          REGISTRY="$(grep '^REGISTRY=' deploy/env/${{ inputs.env_key }}.env | cut -d= -f2)"
          for IMG in backend frontend e2e; do
            docker tag "$REGISTRY/$IMG:${{ inputs.image_tag }}" "$REGISTRY/$IMG:green-${{ inputs.env_key }}" || true
          done
          deploy/scripts/ops-event.sh deployment '${{ inputs.env_key }}' '${{ inputs.image_tag }}' \
            '${{ github.sha }}' '${{ github.actor }}' promoted '' \
            '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          echo "✅ **${{ inputs.env_key }}** ist grün auf \`${{ inputs.image_tag }}\` — Version als last_green markiert." >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: '⛑ Automatischer Rollback (${{ inputs.env_key }})'
    runs-on: [self-hosted, macOS, deploy]
    needs: [prepare, deploy, gate]
    # Auch bei cancelled(): bricht die Concurrency der Eltern-Pipeline einen Lauf
    # mitten in Deploy/Gate ab, stellt dieser Job die Umgebung trotzdem wieder her —
    # eine halb deployte Umgebung darf nie liegen bleiben.
    if: failure() || cancelled()
    permissions:
      contents: read
      packages: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: GHCR-Login (Keychain-frei)
        run: |
          DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          export DOCKER_CONFIG
          mkdir -p "$DOCKER_CONFIG"
          printf '{"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}' > "$DOCKER_CONFIG/config.json"
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: App-Version + Datenbank wiederherstellen
        run: |
          LAST_GREEN='${{ needs.prepare.outputs.last_green }}'
          BACKUP_FILE='${{ needs.prepare.outputs.backup_file }}'
          CURRENT="$(deploy/scripts/state.sh get ${{ inputs.env_key }} current)"
          if [ -z "$LAST_GREEN" ]; then
            if [ "$CURRENT" = '${{ inputs.image_tag }}' ]; then
              echo "⚠️ Bootstrap-Fall: keine letzte grüne Version bekannt — Stack wird gestoppt statt zurückgerollt."
              docker compose -p 'nextgen-${{ inputs.env_key }}' stop || true
              deploy/scripts/ops-event.sh deployment '${{ inputs.env_key }}' '${{ inputs.image_tag }}' \
                '${{ github.sha }}' '${{ github.actor }}' failed '' \
                '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              echo "⚠️ **${{ inputs.env_key }}**: Gate rot beim Bootstrap — kein Rollback-Ziel, Stack gestoppt." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Lauf endete vor dem Deployment (kein last_green, Umgebung unverändert) — nichts wiederherzustellen."
            fi
            exit 0
          fi
          if [ -n "$BACKUP_FILE" ] && [ -f "$BACKUP_FILE" ]; then
            echo "Stelle Datenbank aus Pre-Deploy-Backup wieder her…"
            deploy/scripts/restore.sh ${{ inputs.env_key }} "$BACKUP_FILE"
          else
            echo "⚠️ Kein Backup vorhanden — nur App-Rollback."
          fi
          echo "Rolle App zurück auf letzte grüne Version: $LAST_GREEN"
          IMAGE_TAG="$LAST_GREEN" DEMO_BUG=none deploy/scripts/deploy.sh ${{ inputs.env_key }}
          deploy/scripts/state.sh set ${{ inputs.env_key }} current="$LAST_GREEN"
          deploy/scripts/ops-event.sh deployment '${{ inputs.env_key }}' "$LAST_GREEN" \
            '${{ github.sha }}' '${{ github.actor }}' rolled_back '' \
            '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          # Environments-Seite korrigieren (best effort): das Deployment der fehlgeschlagenen
          # Version deaktivieren und last_green als aktives Deployment nachziehen — sonst
          # zeigt GitHub dauerhaft die Version an, die gar nicht mehr läuft.
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH='Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}'
          DEP_ID="$(curl -fsS -H "$AUTH" "$API/deployments?environment=${{ inputs.gh_environment }}&per_page=1" | jq -r '.[0].id // empty' || true)"
          if [ -n "$DEP_ID" ]; then
            curl -fsS -X POST -H "$AUTH" "$API/deployments/$DEP_ID/statuses" \
              -d '{"state":"inactive"}' >/dev/null || true
          fi
          NEW_DEP="$(curl -fsS -X POST -H "$AUTH" "$API/deployments" \
            -d "{\"ref\":\"${LAST_GREEN#sha-}\",\"environment\":\"${{ inputs.gh_environment }}\",\"auto_merge\":false,\"required_contexts\":[],\"description\":\"Automatischer Rollback auf $LAST_GREEN\"}" \
            | jq -r '.id // empty' || true)"
          if [ -n "$NEW_DEP" ]; then
            curl -fsS -X POST -H "$AUTH" "$API/deployments/$NEW_DEP/statuses" \
              -d '{"state":"success","environment_url":"http://localhost:${{ inputs.frontend_port }}"}' >/dev/null || true
          fi
          {
            echo "## ⛑ Automatischer Rollback durchgeführt"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Umgebung | **${{ inputs.env_key }}** |"
            echo "| Fehlgeschlagene Version | \`${{ inputs.image_tag }}\` |"
            echo "| Wiederhergestellt auf | \`$LAST_GREEN\` |"
            echo "| DB-Restore | ${BACKUP_FILE:-—} |"
            echo ""
            echo "Die Umgebung ist wieder **grün** — die fehlerhafte Version wurde nicht promoted."
          } >> "$GITHUB_STEP_SUMMARY"
